      { id:"navy",    label:"Navy",    cover:"#1B2A4A", spine:"#0f1a2e", gold:"#D4AF6A" },
      { id:"forest",  label:"Forest",  cover:"#2D4A35", spine:"#1a2e20", gold:"#C8B97A" },
      { id:"slate",   label:"Slate",   cover:"#3A3F4A", spine:"#22262f", gold:"#E2C97E" },
      { id:"plum",    label:"Plum",    cover:"#4A1A4A", spine:"#2e0e2e", gold:"#D4A8D4" },
      { id:"black",   label:"Black",   cover:"#111111", spine:"#000000", gold:"#C9A84C" },
      { id:"tan",     label:"Tan",     cover:"#C4A882", spine:"#a08860", gold:"#7a5c2e" },
      { id:"white",   label:"White",   cover:"#F0EBE0", spine:"#d8d0c0", gold:"#8B6914" },
    ];

    const FOILS = [
      { id:"gold",   label:"Gold",   color:"#C9A84C" },
      { id:"black",  label:"Black",  color:"#000000" },
      { id:"white",  label:"White",  color:"#F5F5F5" },

    // ── Test mode dummy data (dev only — never linked from any public page) ──
    const TEST_SEASONS = [
      { season:1, page_count:101, date_from:"2024-08", date_to:"2024-10", status:"ready" },
      { season:2, page_count:119, date_from:"2024-11", date_to:"2025-04", status:"ready" },
      { season:3, page_count:107, date_from:"2025-04", date_to:"2025-08", status:"ready" },
      { season:4, page_count:193, date_from:"2025-08", date_to:"2026-04", status:"ready" },
    ];
    const TEST_PARTICIPANTS = ["Jordan Ellis","Sam Rivera","Casey Kim","Alex Morgan","Taylor Chen"];

    // ─────────────────────────────────────────────
    // BUG 1 FIX: robust WhatsApp name parser
    // Handles both iOS [MM/DD/YY, H:MM:SS AM] Name: msg
    // and Android MM/DD/YY, H:MM AM - Name: msg
    // and Android (EU) DD/MM/YYYY, HH:MM - Name: msg
    // Reads entire file, strips tildes, skips system lines
    // ─────────────────────────────────────────────
    function parseParticipants(text) {
      const lines = text.split("\n");

      // iOS format:  [12/25/23, 10:30:45 AM] Name: message
      const iosRe = /^\[\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}(?::\d{2})?\s*[AaPp][Mm]\]\s*([^:]+?):/;

      // Android US:  12/25/23, 10:30 AM - Name: message
      // Android EU:  25/12/2023, 10:30 - Name: message
      // Android 24h: 25/12/2023, 22:30 - Name: message
      const androidRe = /^\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AaPp][Mm])?\s*-\s*([^:]+?):/;

      const SYSTEM_PATTERNS = [
        /^Messages and calls are end-to-end encrypted/i,
        /joined using this group/i,
        /was added$/i,
        /left$/i,
        /changed the group/i,
        /changed this group/i,
        /changed the subject/i,
        /deleted this message/i,
        /This message was deleted/i,
        /security code changed/i,
        /Your security code/i,
        /created group/i,
        /added you$/i,
        /^\+?[\d\s\(\)\-]{7,}$/, // raw phone number as sender
      ];

      const nameSet = new Set();

      for (const line of lines) {
        let match = line.match(iosRe) || line.match(androidRe);
        if (!match) continue;

        let name = match[1].trim();

        // strip leading tilde (WhatsApp ~ prefix for saved contacts)
        name = name.replace(/^~+/, "").trim();

        // skip empty or implausibly long names
        if (!name || name.length > 60) continue;

        // skip system messages masquerading as senders
        const isSystem = SYSTEM_PATTERNS.some(re => re.test(name));
        if (isSystem) continue;

        // skip pure-digit strings (timestamps leaking through)
        if (/^\d+$/.test(name)) continue;

        nameSet.add(name);
      }

      return [...nameSet];
    }

    // ─────────────────────────────────────────────
    // iMessage participant parser + zip helper
    // Used by both the IndexedDB load in Builder and
    // the manual upload drop zone in Screen2.
    //
    // Differences from parseParticipants:
    //   • Only the iOS timestamp format is needed (chatbook-imessage.py
    //     always writes [M/D/YY, H:MM:SS AM] sender: text)
    //   • "Me" IS included — it's the user's outgoing messages and they
    //     should be able to give themselves a real name on the nickname screen
    //   • Phone numbers / email addresses ARE kept — those are real
    //     iMessage participants; the WhatsApp phone-number filter
    //     would silently discard them
    // ─────────────────────────────────────────────
    function parseImessageParticipants(text) {
      const iosRe = /^\[\d{1,2}\/\d{1,2}\/\d{2,4},\s*\d{1,2}:\d{2}(?::\d{2})?\s*[AaPp][Mm]\]\s*([^:]+?):/;
      const nameSet = new Set();
      for (const line of text.split("\n")) {
        const m = line.match(iosRe);
        if (!m) continue;
        const name = m[1].trim();
        if (!name || name.length > 60) continue;
        nameSet.add(name);
      }
      return [...nameSet];
    }

    async function parseImessageZip(file) {
      const zip = await JSZip.loadAsync(file);
      let chatEntry = null;
      let contactsEntry = null;
      zip.forEach((path, entry) => {
        const base = path.replace(/.*\//, "");
        if (!entry.dir && base === "_chat.txt"    && !chatEntry)    chatEntry    = entry;
        if (!entry.dir && base === "contacts.json" && !contactsEntry) contactsEntry = entry;
      });
      if (!chatEntry) return { participants: [], chatText: "", contacts: {} };
      const text = await chatEntry.async("string");
      let contacts = {};
      if (contactsEntry) {
        try { contacts = JSON.parse(await contactsEntry.async("string")); } catch(e) {}
      }
      return { participants: parseImessageParticipants(text), chatText: text, contacts };
    }

    // WhatsApp zip helper — used by the IndexedDB load in Builder when
    // the user arrives from whatsapp.html with ?platform=whatsapp
    async function parseWhatsappZip(file) {
      const zip = await JSZip.loadAsync(file);
      let chatEntry = null;
      zip.forEach((path, entry) => {
        if (!entry.dir && path.replace(/.*\//, "") === "_chat.txt" && !chatEntry) chatEntry = entry;
      });
      if (!chatEntry) {
        zip.forEach((path, entry) => {
          if (!entry.dir && path.endsWith(".txt") && !chatEntry) chatEntry = entry;
        });
      }
      if (!chatEntry) throw new Error("No _chat.txt found");
      const text = await chatEntry.async("string");
      return { participants: parseParticipants(text), chatText: text };
    }

    // ─────────────────────────────────────────────
    // BUG 2 FIX: AddrForm defined at module level so
    // React never unmounts it during Screen7 re-renders
    // ─────────────────────────────────────────────
    function AddrForm({ addr, onChange, label }) {
      return (
        <div style={{ border:"1px solid #e0e0e0", padding:16, marginBottom:12 }}>
          {label && <div style={{ fontSize:12, fontWeight:500, color:"#aaa", letterSpacing:"0.1em", marginBottom:12 }}>{label}</div>}
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            <input
              type="text" value={addr.name} placeholder="Full name"
              onChange={e => onChange("name", e.target.value)}
              style={inputStyle}
            />
            <input
              type="tel" value={addr.phone||""} placeholder="Phone number"
              onChange={e => onChange("phone", e.target.value)}
              style={inputStyle}
            />
            <input
              type="text" value={addr.line1} placeholder="Street address"
              onChange={e => onChange("line1", e.target.value)}
              style={inputStyle}
            />
            <input
              type="text" value={addr.line2||""} placeholder="Apt, suite, etc. (optional)"
              onChange={e => onChange("line2", e.target.value)}
              style={inputStyle}
            />
            <div style={{ display:"flex", gap:8 }}>
              <input type="text" value={addr.city} placeholder="City"
                onChange={e => onChange("city", e.target.value)}
                style={{ ...inputStyle, flex:2 }} />
              <input type="text" value={addr.state} placeholder="State"
                onChange={e => onChange("state", e.target.value)}
                style={{ ...inputStyle, flex:1 }} />
              <input type="text" value={addr.zip} placeholder="ZIP or ZIP+4"
                onChange={e => onChange("zip", e.target.value)}
                style={{ ...inputStyle, flex:1 }} />
            </div>
          </div>
        </div>
      );
    }

    // shared input style used across the file
    const inputStyle = {
      width:"100%", padding:"11px 14px", border:"1px solid #e0e0e0",
      fontSize:14, fontWeight:300, color:"#111", outline:"none",
      fontFamily:"'DM Sans',sans-serif", background:"#fff",
    };

    // ── Shared UI primitives ──

    // Fix 3: added dateRange prop — displays below season label on book face
    function Book({ cover, spine, foilColor, title, season, dateRange }) {
      return (
        <div style={{ perspective:"900px", display:"flex", justifyContent:"center" }}>
          <div style={{
            position:"relative", transform:"rotateY(-16deg) rotateX(4deg)",
            transformStyle:"preserve-3d",
            filter:"drop-shadow(-12px 20px 36px rgba(0,0,0,0.18))",
            animation:"bookfloat 5s ease-in-out infinite",
          }}>
            <div style={{ position:"absolute", left:-18, top:0, width:18, height:320, background:spine, transform:"rotateY(-90deg) translateX(-9px)", transformOrigin:"right center", borderRadius:"2px 0 0 2px", transition:"background 0.4s" }} />
            <div style={{ width:240, height:320, borderRadius:"2px 4px 4px 2px", overflow:"hidden", position:"relative" }}>
              <div style={{ position:"absolute", inset:0, background:cover, transition:"background 0.4s" }} />
              <div style={{ position:"absolute", inset:0, backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.012) 2px,rgba(255,255,255,0.012) 4px),repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,0.008) 3px,rgba(255,255,255,0.008) 6px)" }} />
              <div style={{ position:"absolute", inset:12, border:"1px solid rgba(255,255,255,0.13)" }} />
              <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center", padding:28 }}>
                <div style={{ fontFamily:"'Playfair Display',serif", fontSize:20, fontWeight:700, color:foilColor, lineHeight:1.2, marginBottom:8, transition:"color 0.4s" }}>{title || "Your Book"}</div>
                <div style={{ width:28, height:1, background:foilColor+"55", margin:"0 auto 8px" }} />
                <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:8, fontWeight:400, letterSpacing:"0.22em", textTransform:"uppercase", color:foilColor+"88" }}>Season {season || 1}</div>
                {dateRange && <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:7, fontWeight:300, letterSpacing:"0.12em", color:foilColor+"66", marginTop:5 }}>{dateRange}</div>}
              </div>
              <div style={{ position:"absolute", bottom:14, left:0, right:0, textAlign:"center", fontFamily:"'DM Sans',sans-serif", fontSize:7, letterSpacing:"0.3em", textTransform:"uppercase", color:"rgba(255,255,255,0.18)" }}>Chatbook</div>
              <div style={{ position:"absolute", right:-5, top:3, width:6, height:314, backgroundImage:"repeating-linear-gradient(to bottom,#ece4d8 0px,#ece4d8 1px,#f4ece0 1px,#f4ece0 3px)", borderRadius:"0 2px 2px 0" }} />
            </div>
          </div>
        </div>
      );
    }

    function ProgressBar({ step, total }) {
      return (
        <div style={{ padding:"16px 24px 0", maxWidth:720, margin:"0 auto" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
            <span style={{ fontSize:11, fontWeight:500, letterSpacing:"0.15em", textTransform:"uppercase", color:"#aaa" }}>Step {step} of {total}</span>
            <span style={{ fontSize:11, color:"#ccc" }}>{Math.round((step/total)*100)}% complete</span>
          </div>
          <div style={{ height:3, background:"#f0f0f0", borderRadius:2 }}>
            <div style={{ height:"100%", background:"#111", borderRadius:2, width:`${(step/total)*100}%`, transition:"width 0.4s ease" }} />
          </div>
        </div>
      );
    }

    function Nav() {
      return (
        <nav style={{ background:"#fff", borderBottom:"1px solid #f0f0f0", padding:"16px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:100 }}>
          <a href="/index.html" style={{ fontFamily:"'Playfair Display',serif", fontSize:17, fontWeight:700, color:"#111", textDecoration:"none" }}>Chatbook</a>
          <span style={{ fontSize:12, color:"#aaa", fontFamily:"'DM Sans',sans-serif" }}>Build your book</span>
        </nav>
      );
    }

    function Btn({ onClick, children, disabled, variant="primary", style:s={} }) {
      const base = { padding:"13px 28px", fontSize:14, fontWeight:500, cursor:disabled?"not-allowed":"pointer", fontFamily:"'DM Sans',sans-serif", border:"none", transition:"opacity 0.15s", opacity:disabled?0.4:1, ...s };
      const styles = variant==="primary" ? { ...base, background:"#111", color:"#fff" } : { ...base, background:"#fff", color:"#555", border:"1px solid #e0e0e0" };
      return <button onClick={disabled?undefined:onClick} style={styles}>{children}</button>;
    }

    function NavBtns({ onBack, onNext, nextLabel="Next →", nextDisabled=false, loading=false }) {
      return (
        <div style={{ display:"flex", gap:12, marginTop:40, paddingTop:24, borderTop:"1px solid #f0f0f0" }}>
          {onBack && <Btn variant="secondary" onClick={onBack}>← Back</Btn>}
          <Btn onClick={onNext} disabled={nextDisabled||loading} style={{ marginLeft:"auto" }}>
            {loading ? "Loading…" : nextLabel}
          </Btn>
        </div>
      );
    }

    function FieldLabel({ children }) {
      return <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.15em", textTransform:"uppercase", color:"#aaa", marginBottom:8 }}>{children}</div>;
    }

    function ErrorMsg({ msg }) {
      if (!msg) return null;
      return <div style={{ marginTop:8, fontSize:12, color:"#c00" }}>{msg}</div>;
    }

    // ══════════════════════════════════════════════
    // SCREEN 1 — Platform picker (WhatsApp / iMessage)
    // ══════════════════════════════════════════════

    /* Coming-soon platforms (Telegram, Discord, Signal, Other) and their
       waitlist email-collection UI have been removed from the visible page.
       The data and logic are preserved below in case they need to be restored.

    const COMING_SOON_PLATFORMS = [
      { id:"telegram", label:"Telegram", emoji:"✈️" },
      { id:"discord",  label:"Discord",  emoji:"🎮" },
      { id:"signal",   label:"Signal",   emoji:"🔒" },
      { id:"other",    label:"Other",    emoji:"💬" },
    ];

    // Waitlist state (used when coming-soon platforms are shown):
    // const [waitlistChecked, setWaitlistChecked] = useState({});
    // const [waitlistEmail, setWaitlistEmail]     = useState("");
    // const [waitlistSubmitted, setWaitlistSubmitted] = useState(false);
    // const [otherPlatformText, setOtherPlatformText] = useState("");

    // function toggleWaitlistPlatform(id) { setWaitlistChecked(prev => ({ ...prev, [id]: !prev[id] })); }
    // function submitWaitlist() {
    //   if (!waitlistEmail.trim() || !waitlistEmail.includes("@")) return;
    //   const selected = COMING_SOON_PLATFORMS.filter(p => waitlistChecked[p.id] && p.id !== "other").map(p => p.label);
    //   const payload = { email: waitlistEmail.trim(), platforms: selected };
    //   if (waitlistChecked["other"] && otherPlatformText.trim()) payload.otherPlatform = otherPlatformText.trim();
    //   console.log("Waitlist signup:", payload);
    //   setWaitlistSubmitted(true);
    // }
    */

    function Screen1({ data, setData, onNext }) {
      const PLATFORMS = [
        { id:"whatsapp", label:"WhatsApp", sub:"Export from the app in seconds" },
        { id:"imessage", label:"iMessage", sub:"Run a quick script on your Mac" },
      ];

      return (
        <div>
          <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.2em", textTransform:"uppercase", color:"#ccc", marginBottom:12 }}>Platform</div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:"#111", marginBottom:8, lineHeight:1.2 }}>Where does your group chat live?</h2>
          <p style={{ fontSize:14, fontWeight:300, color:"#888", marginBottom:32, lineHeight:1.7 }}>Choose your platform to get started.</p>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            {PLATFORMS.map(p => (
              <a key={p.id} href={p.id === "whatsapp" ? "/whatsapp.html" : "/imessage.html"} style={{
                display:"flex", flexDirection:"column", alignItems:"flex-start",
                padding:"22px 22px", gap:8,
                border:"1px solid #ddd",
                background:"#fff",
                textDecoration:"none", textAlign:"left", transition:"border-color 0.15s, background 0.15s",
                fontFamily:"'DM Sans',sans-serif",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor="#111"; e.currentTarget.style.background="#fafafa"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor="#ddd"; e.currentTarget.style.background="#fff"; }}>
                <div style={{ fontSize:16, fontWeight:500, color:"#111" }}>{p.label}</div>
                <div style={{ fontSize:12, fontWeight:300, color:"#aaa", lineHeight:1.5 }}>{p.sub}</div>
              </a>
            ))}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    // SCREEN 2 — Name your book
    // Fix 3: live book preview wired to local state
    // ══════════════════════════════════════════════
    function Screen2({ data, setData, onBack, onNext, onParse }) {
      const [name, setName] = useState(data.bookName || "");
      const [error, setError] = useState("");
      const fileRef = useRef();

      async function handleImessageFile(f) {
        if (!f || !f.name.toLowerCase().endsWith('.zip')) return;
        setName(n => n || f.name.replace(/^Chatbook\s*-\s*/i, '').replace(/\.zip$/i, '').trim());
        try {
          const { participants, chatText, contacts } = await parseImessageZip(f);
          const extra = Object.keys(contacts).length ? { nicknames: contacts } : {};
          setData(d => ({ ...d, file: f, participants, chatText, ...extra }));
        } catch(err) {
          setData(d => ({ ...d, file: f }));
        }
      }

      // When the file loads async from IndexedDB, auto-fill title if still blank
      useEffect(() => {
        if (data.file && data.platform === "imessage") {
          setName(n => n || data.file.name.replace(/^Chatbook\s*-\s*/i, '').replace(/\.zip$/i, '').trim());
        }
      }, [data.file]);

      useEffect(() => {
        if (!name && data.file) {
          const raw = data.file.name
            .replace(/\.zip$/i, "")
            .replace(/^whatsapp chat\s*[-–]\s*/i, "")
            .replace(/^whatsapp chat with\s*/i, "")
            .replace(/[_]/g, " ")
            .trim();
          setName(raw);
        }
      }, []);

      // Auto-detect date range from chat text for book face preview
      const dateRange = (() => {
        const dates = parseMessageDates(data.chatText || "");
        if (dates.length >= 2) {
          const fmt = d => MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
          const f = fmt(dates[0]), l = fmt(dates[dates.length - 1]);
          return f === l ? f : f + " \u2013 " + l;
        }
        return "";
      })();

      // Use cover/foil from data if already chosen, else defaults
      const previewCover = data.coverColor || VIBES[0].cover;
      const previewSpine = data.spineColor || VIBES[0].spine;
      const previewFoil  = data.foilColor  || VIBES[0].gold;

      function advance() {
        if (!name.trim()) { setError("Please enter a name for your book."); return; }
        if ((data.platform === "imessage" || data.platform === "whatsapp") && !data.file) { setError("Please upload your chat zip file."); return; }
        const trimmedName = name.trim();
        setData(d => ({ ...d, bookName: trimmedName, season: 1 }));
        // If we already have a completed session (e.g. navigated back then forward),
        // skip re-uploading and advance directly.
        if (data.sessionId) {
          onNext();
          return;
        }
        // If the chat is a zip, kick off the full server parse.
        // Otherwise just advance (legacy or non-zip path).
        if (data.file && data.file.name.toLowerCase().endsWith(".zip") && onParse) {
          onParse(data.file, trimmedName);
        } else {
          onNext();
        }
      }

      return (
        <div>
          <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.2em", textTransform:"uppercase", color:"#ccc", marginBottom:12 }}>Name your book</div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:"#111", marginBottom:8, lineHeight:1.2 }}>Give this chat a title.</h2>
          <p style={{ fontSize:14, fontWeight:300, color:"#888", marginBottom:32, lineHeight:1.7 }}>It'll be embossed on the cover and spine. Make it something you'd be proud to put on a shelf.</p>

          {/* Live book preview — updates as user types */}
          <div style={{ marginBottom:36 }}>
            <Book cover={previewCover} spine={previewSpine} foilColor={previewFoil}
              title={name || "Your Book"} season={1} dateRange={dateRange} />
          </div>

          {data.platform === "imessage" && (
            <div style={{ marginBottom:28 }}>
              <FieldLabel>Your export file</FieldLabel>
              {data.file ? (
                <div style={{ padding:"12px 16px", border:"1px solid #e0e0e0", background:"#fafafa", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <span style={{ fontSize:13, fontWeight:400, color:"#555" }}>✓&nbsp;{data.file.name}</span>
                  <button onClick={() => setData(d => ({ ...d, file:null }))} style={{ background:"none", border:"none", fontSize:12, color:"#aaa", cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>Remove</button>
                </div>
              ) : (
                <div
                  onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor="#111"; e.currentTarget.style.background="#f7f7f7"; }}
                  onDragLeave={e => { e.currentTarget.style.borderColor="#ddd"; e.currentTarget.style.background="#fff"; }}
                  onDrop={e => { e.preventDefault(); e.currentTarget.style.borderColor="#ddd"; e.currentTarget.style.background="#fff"; handleImessageFile(e.dataTransfer.files[0]); }}
                  onClick={() => fileRef.current.click()}

    // ══════════════════════════════════════════════
    // SCREEN 5 — Episodes + Customization
    // Parses real timestamps from chatText to find
    // natural episode breaks (14+ day gaps), then
    // displays a read-only episode list with date
    // ranges. Merges down to ≤8 episodes if needed.
    // ══════════════════════════════════════════════

    const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function fmtMonthYear(d) {
      return MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
    }

    // Parse every message timestamp from WhatsApp chatText.
    // Returns sorted array of Date objects.
    function parseMessageDates(text) {
      if (!text) return [];
      const lines = text.split("\n");
      // iOS:     [12/25/23, 10:30:45 AM]
      const iosRe = /^\[(\d{1,2})\/(\d{1,2})\/(\d{2,4}),\s*\d{1,2}:\d{2}/;
      // Android: 12/25/23, 10:30 AM - or 25/12/2023, 22:30 -
      const androidRe = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4}),\s*\d{1,2}:\d{2}/;
      const dates = [];
      for (const line of lines) {
        let m = line.match(iosRe) || line.match(androidRe);
        if (!m) continue;
        let a = parseInt(m[1], 10);
        let b = parseInt(m[2], 10);
        let y = parseInt(m[3], 10);
        if (y < 100) y += 2000;
        // WhatsApp iOS is MM/DD/YY; Android can be DD/MM/YYYY or MM/DD/YYYY.
        // Heuristic: if a > 12, it must be DD (day). Otherwise assume MM/DD (US).
        let month, day;
        if (a > 12) { day = a; month = b; }
        else        { month = a; day = b; }
        if (month < 1 || month > 12 || day < 1 || day > 31) continue;
        dates.push(new Date(y, month - 1, day));
      }
      dates.sort((x, y2) => x - y2);
      return dates;
    }

    // Build episode segments from sorted dates array.
    // A new episode starts after a gap of ≥ GAP_DAYS days.
    function buildEpisodes(dates, GAP_DAYS = 14) {
      if (dates.length === 0) return [];
      const episodes = [];
      let start = dates[0];
      let prev  = dates[0];
      for (let i = 1; i < dates.length; i++) {
        const gapMs = dates[i] - prev;
        const gapDays = gapMs / (1000 * 60 * 60 * 24);
        if (gapDays >= GAP_DAYS) {
          episodes.push({ start, end: prev });
          start = dates[i];
        }
        prev = dates[i];
      }
      episodes.push({ start, end: prev });
      return episodes;
    }

    const MIN_EP_DAYS = 21;
    const DAY_MS = 1000 * 60 * 60 * 24;

    // Merge any episode shorter than MIN_EP_DAYS into the shorter of its neighbors.
    function enforceMinDuration(episodes) {
      let eps = episodes.slice();
      let changed = true;
      while (changed && eps.length > 1) {
        changed = false;
        for (let i = 0; i < eps.length; i++) {
          const dur = (eps[i].end - eps[i].start) / DAY_MS;
          if (dur < MIN_EP_DAYS) {
            // merge with the neighbor that produces the shorter combined episode
            const mergeLeft  = i > 0 ? (eps[i].end - eps[i - 1].start) / DAY_MS : Infinity;
            const mergeRight = i < eps.length - 1 ? (eps[i + 1].end - eps[i].start) / DAY_MS : Infinity;
            const idx = mergeLeft <= mergeRight ? i - 1 : i;
            const merged = { start: eps[idx].start, end: eps[idx + 1].end };
            eps.splice(idx, 2, merged);
            changed = true;
            break; // restart scan after any merge
          }
        }
      }
      return eps;
    }

    // Merge the shortest adjacent pair until count ≤ MAX.
    function mergeEpisodes(episodes, MAX = 8) {
      let eps = enforceMinDuration(episodes);
      while (eps.length > MAX) {
        let minSpan = Infinity, minIdx = 0;
        for (let i = 0; i < eps.length - 1; i++) {
          const span = eps[i + 1].end - eps[i].start;
          if (span < minSpan) { minSpan = span; minIdx = i; }
        }
        const merged = { start: eps[minIdx].start, end: eps[minIdx + 1].end };
        eps.splice(minIdx, 1, merged);
        eps.splice(minIdx + 1, 1);
      }
      return eps;
    }

    // Convert episodes to display objects with a date range label.
    function episodesToDisplayList(episodes) {
      return episodes.map(ep => {
        const label = fmtMonthYear(ep.start) === fmtMonthYear(ep.end)
          ? fmtMonthYear(ep.start)
          : fmtMonthYear(ep.start) + " – " + fmtMonthYear(ep.end);
        return { dateRange: label };
      });
    }

    // Compute total span in whole months between first and last message.
    function spanMonths(first, last) {
      return (last.getFullYear() - first.getFullYear()) * 12 + (last.getMonth() - first.getMonth());
    }

    function Screen5({ data, setData, onBack, onNext }) {

          {/* Read-only episode list */}

    // ══════════════════════════════════════════════
    // SCREEN 7 — Checkout
    // BUG 2 FIX: AddrForm moved to module level (above)
    // BUG 3 FIX: sends individual named fields matching backend expectations
    // ══════════════════════════════════════════════
    function Screen7({ data, setData, onBack, testMode }) {
      const [qty, setQty] = useState(data.qty || 1);
      const [shipMode, setShipMode] = useState(data.shipMode || "single");
      const [singleAddr, setSingleAddr] = useState(data.singleAddr || { name:"", phone:"", line1:"", line2:"", city:"", state:"", zip:"", country:"US" });
      const [multiAddrs, setMultiAddrs] = useState(data.multiAddrs || [{ name:"", phone:"", line1:"", line2:"", city:"", state:"", zip:"", country:"US" }]);
      const [consent, setConsent] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState("");
      const [addonChecked, setAddonChecked] = useState({});
      const [testDone, setTestDone] = useState(false);
      const _isTestMode = testMode === true;

      const vibe = VIBES.find(v => v.id === data.vibeId) || VIBES[0];
      const foil = FOILS.find(f => f.id === data.foilId) || FOILS[0];
      const price = 89;

      // Compute effective seasons: base (Season 1) + any checked add-ons
      const allSessionSeasons = data.sessionSeasons || [];
      const baseSeasons = data.selectedSeasons && data.selectedSeasons.length > 0
        ? data.selectedSeasons
        : (allSessionSeasons.length > 0 ? [allSessionSeasons[0]] : null);
      const baseSeasonNums = new Set((baseSeasons || []).map(s => s.season));
      const addonAvailable = allSessionSeasons.filter(s => !baseSeasonNums.has(s.season));
      const checkedAddons = addonAvailable.filter(s => addonChecked[s.season]);
      const effectiveSeasons = baseSeasons ? [...baseSeasons, ...checkedAddons] : checkedAddons;
      const nSeasons = effectiveSeasons.length || 1;
      const total = price * qty * nSeasons;

      function addAddr() {
        if (multiAddrs.length < 10) setMultiAddrs(a => [...a, { name:"", phone:"", line1:"", line2:"", city:"", state:"", zip:"", country:"US" }]);
      }
      function removeAddr(i) { setMultiAddrs(a => a.filter((_,idx) => idx!==i)); }

      async function handleSubmit() {
        if (!consent) { setError("Please agree to the terms to continue."); return; }
        const primaryAddr = shipMode === "single" ? singleAddr : multiAddrs[0];
        if (!_isTestMode && (!primaryAddr.name || !primaryAddr.phone || !primaryAddr.line1 || !primaryAddr.city || !primaryAddr.state || !primaryAddr.zip)) {
          setError("Please complete the shipping address, including phone number."); return;
        }
        setSubmitting(true);
        setError("");

        // In test mode, use dummy address so /submit doesn't get blank shipping fields.
        const effectivePrimaryAddr = _isTestMode
          ? { name:"Test User", phone:"5550000000", line1:"123 Test St", line2:"", city:"San Francisco", state:"CA", zip:"94105", country:"US" }
          : primaryAddr;

        try {
          const fd = new FormData();

          if (_isTestMode) {
            // Create a real server-side session so the order lands in the dashboard
            // and can be approved to exercise the full pipeline.
            const tsRes = await fetch(`${API}/test-session`, { method:"POST" });
            if (!tsRes.ok) throw new Error("Could not create test session (" + tsRes.status + ")");
            const { session_id: testSessionId } = await tsRes.json();
            fd.append("session_id", testSessionId);
          } else if (data.sessionId) {
            // Session-based: send session_id (no file re-upload needed).
            fd.append("session_id", data.sessionId);
          } else if (data.file) {
            // Legacy: attach the zip file directly.
            fd.append("file", data.file);
          }

          // Build seasons array — uses effective seasons (base Season 1 + checked add-ons).
          const seasons = effectiveSeasons.length > 0
            ? effectiveSeasons.map((s, i) => ({
                season:    s.season || i + 1,
                date_from: s.date_from || s.dateFrom || "",
                date_to:   s.date_to   || s.dateTo   || "",
              }))
            : [{
                season:    data.season    || 1,
                date_from: data.dateFrom  || "",
                date_to:   data.dateTo    || "",
              }];

          // Customer / cover / shipping fields
          fd.append("group_name",       data.bookName || "");
          fd.append("customer_name",    effectivePrimaryAddr.name);
          fd.append("customer_email",   data.proofEmail || "");
          fd.append("platform",         data.platform || "whatsapp");
          fd.append("cover_color",      data.coverLabel || vibe.label);
          fd.append("cover_hex",        data.coverColor || vibe.cover);
          fd.append("foil_color",       data.foilLabel || foil.label);
          fd.append("quantity",         String(qty));
          fd.append("total",            String(total));
          fd.append("shipping_mode",    shipMode);
          fd.append("shipping_name",    effectivePrimaryAddr.name);
          fd.append("shipping_phone",   effectivePrimaryAddr.phone || "");
          fd.append("shipping_line1",   effectivePrimaryAddr.line1);
          fd.append("shipping_line2",   effectivePrimaryAddr.line2 || "");
          fd.append("shipping_city",    effectivePrimaryAddr.city);
          fd.append("shipping_state",   effectivePrimaryAddr.state);
          fd.append("shipping_zip",     effectivePrimaryAddr.zip);
          fd.append("shipping_country", effectivePrimaryAddr.country || "US");
          fd.append("dedication",       data.dedication || "");
          fd.append("closing_note",     data.closingNote || "");
          fd.append("nicknames",        JSON.stringify(data.nicknames || {}));
          fd.append("episodes",         JSON.stringify(data.episodes || []));
          fd.append("seasons",          JSON.stringify(seasons));

          if (shipMode === "multiple") {
            fd.append("multi_addresses", JSON.stringify(multiAddrs));
          }

          const res = await fetch("https://aware-nature-production-7dda.up.railway.app/submit", {
            method: "POST",
            body: fd,
          });

          if (!res.ok) throw new Error("Upload failed (" + res.status + ")");
          localStorage.removeItem("chatbook_order_draft"); // Fix 1: clear draft on success
          if (_isTestMode) {
            setTestDone(true);
            setSubmitting(false);
            return;
          }
          window.location.href = "https://buy.stripe.com/4gM28q0Rd3u83ti5U5gbm00?prefilled_quantity=" + (qty * nSeasons);
        } catch(e) {
          setError("Something went wrong: " + e.message + ". Please try again or email hello@ourchatbook.com.");
          setSubmitting(false);
        }
      }

      return (
        <div>
          <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.2em", textTransform:"uppercase", color:"#ccc", marginBottom:12 }}>Checkout</div>
          <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:"#111", marginBottom:8, lineHeight:1.2 }}>Let's make it real.</h2>
          <p style={{ fontSize:14, fontWeight:300, color:"#888", marginBottom:32, lineHeight:1.7 }}>Tell us where to ship it. Your book ships within 2 weeks.</p>

          <div style={{ border:"1px solid #f0f0f0", marginBottom:28 }}>
            <div style={{ padding:"16px 20px", borderBottom:"1px solid #f0f0f0", background:"#fafafa" }}>
              <div style={{ fontSize:12, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:"#aaa" }}>Order summary</div>
            </div>
            {[
              ["Book name",   data.bookName || "—"],
              ...(nSeasons > 1
                ? [["Seasons", `${nSeasons} volumes`]]
                : [["Season",  "Season 1"]]
              ),
              ["Cover",       `${data.coverLabel || vibe.label} · ${data.foilLabel || foil.label} foil`],
              ["Format",      "8.5×11 hardcover, linen wrap"],
              ["Proof email", data.proofEmail || "—"],
              ...(data.dedication ? [["Dedication", data.dedication.slice(0,60)+(data.dedication.length>60?"…":"")]] : []),
            ].map(([k,v]) => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"12px 20px", borderBottom:"1px solid #f0f0f0" }}>
                <span style={{ fontSize:13, fontWeight:300, color:"#888" }}>{k}</span>
                <span style={{ fontSize:13, fontWeight:400, color:"#111", maxWidth:"55%", textAlign:"right" }}>{v}</span>
              </div>
            ))}
          </div>

          <div style={{ marginBottom:24 }}>
            <FieldLabel>Quantity</FieldLabel>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <button onClick={() => setQty(q => Math.max(1,q-1))} style={{ width:36, height:36, border:"1px solid #e0e0e0", background:"#fff", fontSize:18, cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>−</button>
              <span style={{ width:40, textAlign:"center", fontSize:16, fontWeight:500 }}>{qty}</span>
              <button onClick={() => setQty(q => Math.min(10,q+1))} style={{ width:36, height:36, border:"1px solid #e0e0e0", background:"#fff", fontSize:18, cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>+</button>
              <span style={{ fontSize:13, color:"#aaa", marginLeft:8 }}>max 10</span>
            </div>
          </div>

          {addonAvailable.length > 0 && (
            <div style={{ marginBottom:24 }}>
              <FieldLabel>Add more seasons</FieldLabel>
              <p style={{ fontSize:13, fontWeight:300, color:"#aaa", marginBottom:12, lineHeight:1.6 }}>
                Your chat spans {allSessionSeasons.length} seasons. You're starting with Season 1 — add more volumes below.
              </p>
              {addonAvailable.map(s => (
                <label key={s.season} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 0", borderBottom:"1px solid #f0f0f0", cursor:"pointer" }}>
                  <input
                    type="checkbox"
                    checked={!!addonChecked[s.season]}
                    onChange={e => setAddonChecked(prev => ({ ...prev, [s.season]: e.target.checked }))}
                    style={{ width:16, height:16, flexShrink:0, cursor:"pointer" }}
                  />
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:500, color:"#111" }}>Season {s.season}</div>
                    <div style={{ fontSize:12, fontWeight:300, color:"#aaa" }}>{fmtDateRange(s.date_from, s.date_to)}</div>
                  </div>
                  <div style={{ fontSize:13, fontWeight:400, color:"#555", flexShrink:0 }}>+$89 / copy</div>
                </label>
              ))}
            </div>
          )}

          <div style={{ marginBottom:20 }}>
            <FieldLabel>Shipping</FieldLabel>
            <div style={{ display:"flex", gap:0, marginBottom:16 }}>
              {[["single","Single address"],["multiple","Multiple addresses"]].map(([val,label]) => (
                <button key={val} onClick={() => setShipMode(val)} style={{ padding:"10px 18px", border:"1px solid #e0e0e0", background:shipMode===val?"#111":"#fff", color:shipMode===val?"#fff":"#555", fontSize:13, fontWeight:500, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", marginRight:-1 }}>{label}</button>
              ))}
            </div>

            {shipMode === "single" && (
              <AddrForm addr={singleAddr} onChange={(field,val) => setSingleAddr(a => ({ ...a, [field]:val }))} />
            )}

            {shipMode === "multiple" && (
              <div>
                <div style={{ fontSize:12, color:"#aaa", marginBottom:12 }}>Add up to 10 shipping addresses — one book per address.</div>
                {multiAddrs.map((a, i) => (
                  <div key={i}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                      <div style={{ fontSize:12, fontWeight:500, color:"#aaa", letterSpacing:"0.08em" }}>Address {i+1}</div>
                      {i > 0 && <button onClick={() => removeAddr(i)} style={{ background:"none", border:"none", fontSize:12, color:"#ccc", cursor:"pointer" }}>Remove</button>}
                    </div>
                    <AddrForm addr={a} onChange={(field,val) => setMultiAddrs(addrs => addrs.map((x,idx) => idx===i ? { ...x, [field]:val } : x))} />
                  </div>
                ))}
                {multiAddrs.length < 10 && (
                  <button onClick={addAddr} style={{ width:"100%", padding:"10px", border:"1px dashed #ddd", background:"none", fontSize:13, color:"#aaa", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", marginBottom:8 }}>+ Add another address</button>
                )}
              </div>
            )}
          </div>

          <div style={{ padding:"16px 20px", background:"#fafafa", border:"1px solid #f0f0f0", marginBottom:24, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div>
              <div style={{ fontSize:13, fontWeight:300, color:"#888" }}>
                {nSeasons > 1 ? `${qty} × ${nSeasons} seasons × $89` : `${qty} × $89`}
              </div>
              <div style={{ fontSize:11, fontWeight:300, color:"#bbb", marginTop:2 }}>+ shipping calculated at checkout</div>
            </div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:26, fontWeight:700, color:"#111" }}>${total}</div>
          </div>

          <label style={{ display:"flex", gap:12, alignItems:"flex-start", cursor:"pointer", marginBottom:24, padding:"16px", border:consent?"1px solid #111":"1px solid #e0e0e0", background:consent?"#fafafa":"#fff" }}>
            <input type="checkbox" checked={consent} onChange={e => { setConsent(e.target.checked); setError(""); }}
              style={{ marginTop:2, flexShrink:0, width:16, height:16, cursor:"pointer" }} />
            <div style={{ fontSize:13, fontWeight:300, color:"#555", lineHeight:1.6 }}>
              I've got consent from everyone in this chat to be included in a printed book.{" "}
              <span style={{ color:"#aaa" }}>Don't buy this if your friends aren't cool with it.</span>
            </div>
          </label>

          <ErrorMsg msg={error} />

          {testDone ? (
            <div style={{ paddingTop:16, borderTop:"1px solid #f0f0f0", marginTop:8 }}>
              <div style={{ padding:"20px 24px", background:"#f7faf7", border:"1px solid #c3e6c3", marginBottom:12 }}>
                <div style={{ fontSize:14, fontWeight:500, color:"#2a6a2a", marginBottom:6 }}>TEST MODE — Checkout complete</div>
                <div style={{ fontSize:13, fontWeight:300, color:"#555", lineHeight:1.6 }}>No real order was placed. Full wizard flow confirmed working end-to-end.</div>
              </div>
            </div>
          ) : (
            <div style={{ paddingTop:16, borderTop:"1px solid #f0f0f0", marginTop:8 }}>
              <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                <Btn variant="secondary" onClick={onBack}>← Back</Btn>
                <button onClick={handleSubmit} disabled={submitting} style={{ flex:1, padding:"15px 0", background:submitting?"#555":"#111", color:"#fff", border:"none", fontSize:15, fontWeight:500, cursor:submitting?"not-allowed":"pointer", fontFamily:"'DM Sans',sans-serif", transition:"background 0.15s" }}>
                  {submitting ? (
                    <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:10 }}>
                      <span style={{ display:"inline-block", width:16, height:16, border:"2px solid #fff", borderTopColor:"transparent", borderRadius:"50%", animation:"spin 0.7s linear infinite" }} />
                      Uploading…
                    </span>
                  ) : `Pay Now · $${total}`}
                </button>
              </div>
              <div style={{ marginTop:12, fontSize:11, fontWeight:300, color:"#bbb", textAlign:"center", lineHeight:1.6 }}>
                Secure payment via Stripe · Your chat data is deleted after processing
              </div>
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    // ParseProgress overlay
    //   phase="parsing"  → spinner while server works
    //   phase="seasons"  → season review; user clicks Continue
    // ══════════════════════════════════════════════
    const PARSE_COPY = [
      "Reading every message…",
      "Counting pages…",
      "Detecting natural chapter breaks…",
      "Formatting your book interior…",
      "Calculating season lengths…",
      "Almost there…",
    ];

    function fmtDateRange(from, to) {
      function fmt(s) {
        if (!s) return "";
        const [y, m] = s.split("-");
        return MONTH_NAMES[parseInt(m,10)-1] + " " + y;
      }
      const f = fmt(from), t = fmt(to);
      if (!f && !t) return "";
      if (f === t || !t) return f;
      if (!f) return t;
      return f + " – " + t;
    }

    function ParseProgress({ phase, seasons, error, onRetry, onContinue }) {
      const [msgIdx, setMsgIdx] = useState(0);
      useEffect(() => {
        if (phase !== "parsing" || error) return;
        const t = setInterval(() => setMsgIdx(i => (i + 1) % PARSE_COPY.length), 3500);
        return () => clearInterval(t);
      }, [phase, error]);

      const overlayStyle = {
        position:"fixed", inset:0, background:"rgba(255,255,255,0.97)", zIndex:1000,
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
        padding:32, textAlign:"center",
      };

      // ── Error state ───────────────────────────────────────────────────────
      if (error) {
        return (
          <div style={overlayStyle}>
            <div style={{ fontSize:15, fontWeight:500, color:"#c00", marginBottom:16 }}>Something went wrong</div>
            <div style={{ fontSize:13, color:"#888", marginBottom:24, maxWidth:400, lineHeight:1.6 }}>{error}</div>
            <Btn onClick={onRetry}>Try again</Btn>
          </div>
        );
      }

      // ── Season review (informational — no prices) ────────────────────────
      if (phase === "seasons") {
        const n = seasons.length;
        return (
          <div style={{ ...overlayStyle, justifyContent:"flex-start", overflowY:"auto", paddingTop:64 }}>
            <div style={{ maxWidth:520, width:"100%", textAlign:"left" }}>
              <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.2em", textTransform:"uppercase", color:"#ccc", marginBottom:12 }}>
                Your chat is ready
              </div>
              <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:"#111", marginBottom:8, lineHeight:1.2 }}>
                {n === 1 ? "Your chat fits in one book." : `Your chat fills ${n} books.`}
              </h2>
              <p style={{ fontSize:14, fontWeight:300, color:"#888", marginBottom:32, lineHeight:1.7 }}>
                {n === 1 ? "Page count and date range are confirmed below." : "Here's how we've organized it."}
              </p>

              {/* Season list — no prices */}
              <div style={{ marginBottom:40 }}>
                {seasons.map((s) => (
                  <div key={s.season} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"14px 0", borderBottom:"1px solid #f0f0f0" }}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:500, color:"#111", marginBottom:3 }}>Season {s.season}</div>
                      <div style={{ fontSize:12, fontWeight:300, color:"#aaa" }}>{fmtDateRange(s.date_from, s.date_to)}</div>
                    </div>
                    <div style={{ fontSize:13, fontWeight:400, color:"#555" }}>
                      {s.page_count ? `${s.page_count} pages` : "—"}
                    </div>
                  </div>
                ))}
              </div>

              <Btn onClick={() => onContinue(seasons[0])} style={{ width:"100%" }}>
                Start with Season 1 →
              </Btn>
            </div>
          </div>
        );
      }

      // ── Spinner (parsing) ─────────────────────────────────────────────────
      return (
        <div style={overlayStyle}>
          <div style={{ width:36, height:36, border:"3px solid #111", borderTopColor:"transparent", borderRadius:"50%", animation:"spin 0.8s linear infinite", marginBottom:24 }} />
          <div style={{ fontSize:15, fontWeight:500, color:"#111", marginBottom:8 }}>Analyzing your chat…</div>
          <div style={{ fontSize:13, color:"#aaa", transition:"opacity 0.3s", minHeight:20 }}>{PARSE_COPY[msgIdx]}</div>
          <div style={{ marginTop:16, fontSize:11, color:"#ddd" }}>This usually takes 2–5 minutes</div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    // ROOT
    // Fix 1: localStorage draft save/restore
    // ══════════════════════════════════════════════
    const DRAFT_KEY = "chatbook_order_draft";
    const API = "https://aware-nature-production-7dda.up.railway.app";

    function Builder() {
      const _urlParams = new URLSearchParams(window.location.search);
      const _platformParam = _urlParams.get('platform');
      const _titleParam = _urlParams.get('title') || '';
      const _skipToStep2 = _platformParam === 'imessage' || _platformParam === 'whatsapp';
      const _testMode = _urlParams.get('test') === 'true';
      const [step, setStep] = useState(_skipToStep2 || _testMode ? 2 : 1);
      const [data, setData] = useState(() => {
        if (_testMode) return { platform:'whatsapp', bookName:'Test Chat', participants:TEST_PARTICIPANTS, sessionSeasons:TEST_SEASONS, selectedSeasons:TEST_SEASONS };
        if (_skipToStep2) return { platform:_platformParam, bookName:_titleParam };
        return {};
      });
      const [draft, setDraft] = useState(null); // non-null = show banner
      // parsePhase: null = no overlay | "parsing" = spinner | "seasons" = season review
      const [parsePhase, setParsePhase] = useState(_testMode ? "seasons" : null);
      const [parseError, setParseError] = useState("");
      const TOTAL = 7;

      // Fix 2: browser history — push a state entry for each step
      useEffect(() => {
        // Replace state on first load, push on subsequent steps
        const method = step === 1 ? "replaceState" : "pushState";
        window.history[method]({ step }, "", "#step-" + step);
      }, [step]);

      // Fix 2: handle browser Back/Forward within the wizard
      useEffect(() => {
        function handlePop(e) {
          if (e.state && typeof e.state.step === "number") {
            setStep(e.state.step);
            window.scrollTo(0, 0);
          }
        }
        window.addEventListener("popstate", handlePop);
        return () => window.removeEventListener("popstate", handlePop);
      }, []);

      // On mount: check for saved draft
      useEffect(() => {
        if (_testMode) return;
        try {
          const saved = localStorage.getItem(DRAFT_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            // only surface banner if they got past step 1
            if (parsed && parsed.step > 1 && parsed.data) {
              setDraft(parsed);
            }
          }
        } catch(e) {}
      }, []);

      // On mount: restore session + load file.
      // 1. Check sessionStorage for a completed parse (survives back-nav).
      // 2. Check IndexedDB for session_id stored by the platform page.
      // 3. Load the zip file from IndexedDB for client-side participant parsing.
      useEffect(() => {
        if (!_skipToStep2 || _testMode) return;

        // Synchronously check sessionStorage for a completed session
        let hasCompletedSession = false;
        try {
          const raw = sessionStorage.getItem('chatbook_parsed_session');
          if (raw) {
            const ss = JSON.parse(raw);
            if (ss && ss.sessionId) {
              setData(d => ({ ...d, ...ss }));
              setParsePhase("seasons");
              hasCompletedSession = true;
            }
          }
        } catch(e) {}

        // Open IndexedDB for session_id and file
        try {
          const req = indexedDB.open('chatbook', 1);
          req.onsuccess = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('files')) return;
            const tx = db.transaction('files', 'readonly');
            const store = tx.objectStore('files');

            // Read session_id stored by the platform page on file drop
            const sessionReq = store.get('chatbook_session');
            sessionReq.onsuccess = se => {
              const session = se.target.result;
              if (session && session.session_id) {
                setData(d => ({ ...d, sessionId: session.session_id }));
                if (!hasCompletedSession) {
                  setParsePhase("parsing");
                  pollSession(session.session_id);
                }
              }
            };

            // Read zip file for client-side participant / chatText extraction
            const fileReq = store.get('pending');
            fileReq.onsuccess = async fe => {
              const file = fe.target.result;
              if (!file) return;
              try {
                if (_platformParam === 'imessage') {
                  const { participants, chatText, contacts } = await parseImessageZip(file);
                  const extra = Object.keys(contacts).length ? { nicknames: contacts } : {};
                  setData(d => ({ ...d, file, participants, chatText, ...extra }));
                } else {
                  const { participants, chatText } = await parseWhatsappZip(file);
                  setData(d => ({ ...d, file, participants, chatText }));
                }
              } catch(err) {
                setData(d => ({ ...d, file }));
              }
            };
          };
        } catch(e) {}
      }, []);

      // Persist data + step to localStorage whenever they change
      // Skip file/chatText (not serializable or too large)
      useEffect(() => {
        if (_testMode) return;
        if (step === 1 && Object.keys(data).length === 0) return;
        try {
          const { file, chatText, ...saveable } = data;
          localStorage.setItem(DRAFT_KEY, JSON.stringify({ data: saveable, step }));
        } catch(e) {}
      }, [data, step]);

      function restoreDraft() {
        setData(draft.data);
        setStep(draft.step);
        setDraft(null);
      }

      function dismissDraft() {
        localStorage.removeItem(DRAFT_KEY);
        setDraft(null);
      }

      const next = () => { setStep(s => Math.min(s+1,TOTAL)); window.scrollTo(0,0); };
      const back = () => { setStep(s => Math.max(s-1,1)); window.scrollTo(0,0); };

      async function pollSession(session_id) {
        for (let attempt = 0; attempt < 120; attempt++) {
          await new Promise(r => setTimeout(r, 5000));
          try {
            const res = await fetch(`${API}/sessions/${session_id}/status`);
            if (!res.ok) continue;
            const sess = await res.json();
            if (sess.status === "ready") {
              const readySeasons = (sess.seasons || []).filter(s => s.status === "ready");
              const sessionState = { sessionId: session_id, sessionSeasons: readySeasons, selectedSeasons: readySeasons };
              // Persist across navigation / page reloads
              try { sessionStorage.setItem('chatbook_parsed_session', JSON.stringify(sessionState)); } catch(_) {}
              setData(d => ({ ...d, ...sessionState }));
              // Switch to season-review phase — user must click Continue to advance
              setParsePhase("seasons");
              return;
            }
            if (sess.status === "error") {
              setParseError("Parse failed: " + (sess.parse_error || "Unknown error. Please try again."));
              // Keep phase="parsing" so the overlay stays open to show the error
              return;
            }
          } catch(_) { /* transient — keep polling */ }
        }
        setParseError("Parse timed out. Please try again.");
      }

      async function startFullParse(file, groupName) {
        setParsePhase("parsing");
        setParseError("");
        const fd = new FormData();
        fd.append("file", file);
        fd.append("group_name", groupName || "Our Chat");
        fd.append("platform", data.platform || "whatsapp");
        try {
          const res = await fetch(`${API}/full-parse`, { method:"POST", body:fd });
          if (!res.ok) throw new Error("Server error (" + res.status + ")");
          const { session_id } = await res.json();
          await pollSession(session_id);
        } catch(e) {
          setParseError("Upload failed: " + e.message + ". Please try again.");
          // Keep overlay open (phase still "parsing") so error is visible
        }
      }

      const screens = [
        <Screen1 data={data} setData={setData} onNext={next} />,
        <Screen2 data={data} setData={setData} onBack={back} onNext={next} onParse={startFullParse} />,
        <Screen3 data={data} setData={setData} onBack={back} onNext={next} />,
        <Screen4 data={data} setData={setData} onBack={back} onNext={next} />,
        <Screen5 data={data} setData={setData} onBack={back} onNext={next} />,
        <Screen6 data={data} setData={setData} onBack={back} onNext={next} />,
        <Screen7 data={data} setData={setData} onBack={back} testMode={_testMode} />,
      ];

      return (
        <div style={{ background:"#fff", minHeight:"100vh", fontFamily:"'DM Sans',sans-serif", fontWeight:300, color:"#111" }}>
          {parsePhase && (
            <ParseProgress
              phase={parsePhase}
              seasons={data.sessionSeasons || []}
              error={parseError}
              onRetry={() => { setParseError(""); setParsePhase(null); }}
              onContinue={(firstSeason) => { if (firstSeason) setData(d => ({ ...d, selectedSeasons: [firstSeason] })); setParsePhase(null); next(); }}
            />
          )}
          {_testMode && (
            <div style={{ position:"fixed", top:8, right:8, zIndex:9999, background:"#c00", color:"#fff", fontSize:10, fontWeight:700, letterSpacing:"0.15em", padding:"4px 10px", borderRadius:3, pointerEvents:"none" }}>TEST MODE</div>
          )}
          <Nav />

          {/* Draft restore banner */}
          {draft && (
            <div style={{ background:"#111", padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
              <div>
                <span style={{ fontSize:13, fontWeight:500, color:"#fff" }}>Continue where you left off</span>
                {draft.data.bookName && <span style={{ fontSize:12, fontWeight:300, color:"#aaa", marginLeft:8 }}>— {draft.data.bookName}</span>}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={restoreDraft} style={{ padding:"8px 18px", background:"#fff", color:"#111", border:"none", fontSize:12, fontWeight:500, cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>
                  Resume (step {draft.step} of {TOTAL})
                </button>
                <button onClick={dismissDraft} style={{ padding:"8px 12px", background:"none", color:"#888", border:"1px solid #444", fontSize:12, cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>
                  Start over
                </button>
              </div>
            </div>
          )}

          <ProgressBar step={step} total={TOTAL} />
          <div style={{ maxWidth:600, margin:"0 auto", padding:"40px 24px 80px" }}>
            {screens[step-1]}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Builder />);
  </script>
</body>
</html>
